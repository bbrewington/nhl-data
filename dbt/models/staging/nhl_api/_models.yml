version: 2

models:
  - name: stg_nhl_api__play_by_play_events
    description: Play-by-play events from the NHL API, one row per event, with situation_code parsed into skater/goalie counts
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - game_id
            - event_id
    columns:
      - name: game_id
        description: NHL 10-digit game identifier
        tests: [not_null]
      - name: event_id
        description: Event identifier, unique within a game
        tests: [not_null]
      - name: type_desc_key
        description: Event type (e.g. shot_on_goal, goal, faceoff), normalized from hyphens to underscores
        tests:
          - accepted_values:
              values:
                - faceoff
                - hit
                - giveaway
                - takeaway
                - shot_on_goal
                - goal
                - missed_shot
                - blocked_shot
                - penalty
                - stoppage
                - period_start
                - period_end
                - game_end
                - delayed_penalty
                - failed_shot_attempt
                - shootout_complete
      - name: home_goalie_on_ice
        description: Whether the home team's goalie is on the ice, parsed from situation_code
      - name: home_skaters
        description: Number of home team skaters on the ice, parsed from situation_code
      - name: away_skaters
        description: Number of away team skaters on the ice, parsed from situation_code
      - name: away_goalie_on_ice
        description: Whether the away team's goalie is on the ice, parsed from situation_code

  - name: stg_nhl_api__boxscores
    description: Player-game boxscore stats from the NHL API, one row per player per game
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - game_id
            - player_id
    columns:
      - name: game_id
        description: NHL 10-digit game identifier
        tests: [not_null]
      - name: player_id
        description: NHL player identifier
        tests: [not_null]
      - name: position_group
        description: Player position group (forwards, defense, goalies)
        tests:
          - accepted_values:
              values: [forwards, defense, goalies]
      - name: toi
        description: Time on ice as source string (mm:ss)
      - name: toi_seconds
        description: Time on ice in seconds, parsed from toi

  - name: stg_nhl_api__game_rosters
    description: Game roster entries from the NHL API, one row per player per game
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - game_id
            - player_id
    columns:
      - name: game_id
        description: NHL 10-digit game identifier
        tests: [not_null]
      - name: player_id
        description: NHL player identifier
        tests: [not_null]
      - name: team_id
        description: NHL team identifier
        tests: [not_null]
      - name: position_code
        description: Player position code (e.g. C, L, R, D, G)

  - name: stg_nhl_api__games
    description: One row per game with home/away team identity, from the NHL API play-by-play response's top-level homeTeam/awayTeam objects
    tests:
      - unique:
          column_name: game_id
    columns:
      - name: game_id
        description: NHL 10-digit game identifier
        tests: [not_null]
      - name: home_team_id
        description: NHL numeric team identifier for the home team
        tests: [not_null]
      - name: home_team_abbr
        description: 3-letter team abbreviation for the home team
        tests: [not_null]
      - name: away_team_id
        description: NHL numeric team identifier for the away team
        tests: [not_null]
      - name: away_team_abbr
        description: 3-letter team abbreviation for the away team
        tests: [not_null]
