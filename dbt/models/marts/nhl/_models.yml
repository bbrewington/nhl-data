version: 2

models:
  - name: fct_nhl__shot_attempts
    description: >
      Core Corsi/Fenwick fact table. Grain: one row per shot-attempt event
      (shot_on_goal, goal, missed_shot, blocked_shot) - a pure select/rename over
      int_nhl__shot_events with team_id/opponent_team_id resolved from stg_nhl_api__games.
      x_coord/y_coord are the normalized coordinates (offensive zone always positive x),
      not the raw API coordinates.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - game_id
            - event_id
    columns:
      - name: game_id
        description: NHL 10-digit game identifier
        tests: [not_null]
      - name: event_id
        description: Event identifier, unique within a game
        tests: [not_null]
      - name: player_id
        description: Shooter's NHL player id (scoring_player_id for goals, shooting_player_id otherwise)
      - name: team_id
        description: NHL numeric team id of the shooting team
        tests: [not_null]
      - name: opponent_team_id
        description: NHL numeric team id of the opposing team
        tests: [not_null]
      - name: is_corsi_event
        description: Always true in this table - every row is a shot attempt (CF/CA)
        tests: [not_null]
      - name: is_fenwick_event
        description: True for all shot-attempt types except blocked_shot (FF/FA)
        tests: [not_null]
      - name: is_shot_on_goal
        description: True for shot_on_goal and goal events (SOG)
        tests: [not_null]
      - name: is_goal
        description: True for goal events only
        tests: [not_null]
      - name: is_rebound
        description: True when this shot attempt occurred within 3 seconds of a prior shot attempt by either team
        tests: [not_null]
      - name: is_rush_shot
        description: True when this shot attempt occurred within 4 seconds of the immediately prior event and that event was in a different zone
        tests: [not_null]
      - name: is_home_event
        description: Whether the shooting team is the home team
        tests: [not_null]

  - name: fct_nhl__player_game_events
    description: >
      One row per event per player involvement, across all event types (not just shots).
      Built by unpivoting every player-id column on int_nhl__events_enriched (shooter, goalie
      facing the shot, hitter/hittee, blocker, giveaway/takeaway player, faceoff winner/loser,
      goal scorer/assists, penalty committed/drawn/served by) into a player_role-tagged row,
      then joining team_id from stg_nhl_api__game_rosters and toi_seconds (game-level, not
      event-level) from stg_nhl_api__boxscores.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - game_id
            - event_id
            - player_role
    columns:
      - name: game_id
        description: NHL 10-digit game identifier
        tests: [not_null]
      - name: player_id
        description: NHL numeric player id involved in the event
        tests: [not_null]
      - name: team_id
        description: NHL numeric team id the player belongs to for this game, from stg_nhl_api__game_rosters
      - name: event_id
        description: Event identifier, unique within a game
        tests: [not_null]
      - name: event_type
        description: Normalized type_desc_key of the underlying event
        tests: [not_null]
      - name: player_role
        description: >
          How this player was involved in the event - shooter, goalie_in_net, hitter, hittee,
          blocker, giveaway, takeaway, faceoff_winner, faceoff_loser, scorer, assist1, assist2,
          penalty_committed_by, penalty_drawn_by, or penalty_served_by.
        tests:
          - accepted_values:
              values:
                - shooter
                - goalie_in_net
                - hitter
                - hittee
                - blocker
                - giveaway
                - takeaway
                - faceoff_winner
                - faceoff_loser
                - scorer
                - assist1
                - assist2
                - penalty_committed_by
                - penalty_drawn_by
                - penalty_served_by
      - name: toi_seconds
        description: Player's total time-on-ice for the game (from stg_nhl_api__boxscores), not per-event.
